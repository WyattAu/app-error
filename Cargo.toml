[package]
name = "app-error"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Common application error variants with recovery classification"
repository = "https://github.com/WyattAu/app-error"
keywords = ["error", "thiserror", "recovery", "application"]
categories = ["rust-patterns"]

[dependencies]
thiserror = "2"
error-codes = { path = "../errcode", package = "error-codes", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
proptest = "1"
serde_json = "1"

[features]
default = ["std", "errcode"]
std = []
errcode = ["dep:error-codes"]
serde = ["dep:serde"]
