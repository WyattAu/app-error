[package]
name = "error-classify"
version = "0.3.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Common application error variants with recovery classification"
repository = "https://github.com/WyattAu/app-error"
keywords = ["error", "thiserror", "recovery", "application"]
categories = ["rust-patterns"]
exclude = ["/target"]

[dependencies]
thiserror = { version = "2", default-features = false }
error-codes = { version = "1.0", package = "error-codes", optional = true }
error-classify-derive = { version = "0.1", path = "crates/error-classify-derive", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
proptest = "1"
serde_json = "1"

[features]
default = ["std", "errcode"]
std = ["thiserror/std", "error-codes?/std"]
alloc = []
errcode = ["dep:error-codes"]
derive = ["dep:error-classify-derive"]
serde = ["dep:serde"]

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
